[package]
  edition = "2021"
  name = "workflows"
  version = "0.1.0"

[features]
  private = ["clients/private"]

[dependencies]
  anyhow = "1"
  chrono = "0.4"
  clients = { path = "../clients" }
  domain = { path = "../domain" }
  secrecy = "0.8"
  serde = { version = "1", features = ["derive"] }
  serde_json = "1"
  store = { path = "../store" }
  tempfile = "3"
  tokio = { version = "1", features = ["full"] }
  uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
  insta = { version = "1", features = ["json"] }
  rstest = "0.25"
  tempfile = "3"

[lints]
  workspace = true
