[package]
  description = "Starts a program that macOS holds responsible for itself"
  edition = "2021"
  name = "disclaimed-spawn"
  version = "0.1.0"

# The crate is empty off macOS (decision 031), so it needs nothing there.
[target.'cfg(target_os = "macos")'.dependencies]
  libc = "0.2"
  tokio = { version = "1", features = ["full"] }

# The workspace's lints, with `unsafe_code` relaxed from "forbid" to "deny" so the few calls into
# libSystem can each be allowed where they are made. Every other crate inherits the workspace's
# "forbid". scripts/src/repo_state/lint_inheritance.rs holds this table to that copy, and
# docs/invariants/unsafe-code-lives-only-in-disclaimed-spawn.md says why.
[lints.clippy]
  expect_used = "warn"
  indexing_slicing = "warn"
  nursery = { level = "warn", priority = -1 }
  # Suggests map_or, which disallowed-methods in clippy.toml rules out in favour of a match.
  map_unwrap_or = "allow"
  # A match names both cases in order; map_or_else hides them in two closures, None first.
  option_if_let_else = "allow"
  panic = "warn"
  pedantic = { level = "warn", priority = -1 }
  redundant_pub_crate = "allow"
  unwrap_used = "warn"

[lints.rust]
  missing_debug_implementations = "deny"
  missing_docs = "warn"
  unreachable_pub = "warn"
  unsafe_code = "deny"
  unused_results = "deny"

[lints.rustdoc]
  broken_intra_doc_links = "deny"
