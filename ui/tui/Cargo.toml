[package]
  edition = "2021"
  name = "hub-tui"
  version = "0.1.0"

[[bin]]
  name = "hub-tui"
  path = "src/main.rs"

[features]
  private = ["workflows/private"]

[dependencies]
  ansi-to-tui = "8"
  anyhow = "1"
  chrono = "0.4"
  clients = { path = "../../clients" }
  config = { path = "../../config" }
  crossterm = { version = "0.28", features = ["event-stream"] }
  domain = { path = "../../domain" }
  futures = "0.3"
  itertools = "0.14"
  open = "5"
  pulldown-cmark = { version = "0.13", default-features = false }
  ratatui = "0.30"
  rusqlite = { version = "0.31", features = ["bundled"] }
  serde_json = "1"
  store = { path = "../../store" }
  syntect = { version = "5", default-features = false, features = [
    "default-fancy",
  ] }
  tokio = { version = "1", features = ["full"] }
  tui-input = "0.15"
  two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
  ] }
  workflows = { path = "../../workflows" }

[dev-dependencies]
  insta = "1"
  rstest = "0.23"
