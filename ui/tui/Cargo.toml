[package]
name = "hub-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hub-tui"
path = "src/main.rs"

[features]
private = ["workflows/private"]

[dependencies]
anyhow = "1"
chrono = "0.4"
config = { path = "../../config" }
crossterm = { version = "0.28", features = ["event-stream"] }
domain = { path = "../../domain" }
futures = "0.3"
open = "5"
ratatui = "0.30"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
store = { path = "../../store" }
tokio = { version = "1", features = ["full"] }
workflows = { path = "../../workflows" }
