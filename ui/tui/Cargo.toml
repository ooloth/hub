[package]
  edition = "2021"
  name = "hub-tui"
  version = "0.1.0"

[[bin]]
  name = "hub-tui"
  path = "src/main.rs"

[features]
  private = ["workflows/private"]

[dependencies]
  # Pinned in sync with ratatui below — see that comment before upgrading either.
  ansi-to-tui = "7"
  anyhow = "1"
  chrono = "0.4"
  clients = { path = "../../clients" }
  config = { path = "../../config" }
  crossterm = { version = "0.28", features = ["event-stream"] }
  domain = { path = "../../domain" }
  futures = "0.3"
  itertools = "0.14"
  open = "5"
  pulldown-cmark = { version = "0.13", default-features = false }
  # Pinned to 0.29 to unify with tui-textarea 0.7, which also depends on 0.29.
  # tui-textarea 0.7 implements ratatui 0.29's Widget trait; ratatui 0.30 moved
  # Widget into a new ratatui-core crate, making set_block() and direct TextArea
  # rendering fail to compile. Before bumping this, check that the target
  # tui-textarea version also supports the new ratatui version — and keep
  # ansi-to-tui in sync (v8 switched to ratatui-core; v7 uses ratatui 0.29).
  ratatui = "0.29"
  rusqlite = { version = "0.31", features = ["bundled"] }
  secrecy = "0.8"
  serde_json = "1"
  store = { path = "../../store" }
  syntect = { version = "5", default-features = false, features = [
    "default-fancy",
  ] }
  tokio = { version = "1", features = ["full"] }
  tui-textarea = { version = "0.7", features = ["crossterm"] }
  two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
  ] }
  workflows = { path = "../../workflows" }

[dev-dependencies]
  insta = "1"
  proptest = "1"
  rstest = "0.23"
