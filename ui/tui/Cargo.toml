[package]
  edition = "2021"
  name = "hub-tui"
  version = "0.1.0"

[[bin]]
  name = "hub-tui"
  path = "src/main.rs"

[features]
  # Home-laptop only: compiles the real `investigations::media` from hub-private.
  # Without it, `private` builds use `investigations/media_stub.rs`. The justfile
  # turns it on when the hub-private symlink exists.
  # See docs/invariants/hub-builds-with-and-without-each-private-module.md
  media = ["private"]
  private = ["workflows/private"]

[dependencies]
  # Pinned in sync with ratatui below — see that comment before upgrading either.
  ansi-to-tui = "8"
  anyhow = "1"
  chrono = "0.4"
  clients = { path = "../../clients" }
  config = { path = "../../config" }
  # The crossterm version ratatui depends on (0.29 for ratatui 0.30). deny.toml rejects a second
  # copy, so this moves with ratatui.
  crossterm = { version = "0.29", features = ["event-stream"] }
  domain = { path = "../../domain" }
  futures = "0.3"
  open = "5"
  pulldown-cmark = { version = "0.13", default-features = false }
  # ansi-to-tui must depend on this ratatui version: v8 builds on the ratatui-core that ratatui
  # 0.30 uses. ratatui, crossterm and ansi-to-tui move together, and
  # Dependabot proposes them as one PR (the `tui` group in .github/dependabot.yml).
  ratatui = "0.30"
  rusqlite = { version = "0.41", features = ["bundled"] }
  secrecy = "0.10"
  serde_json = "1"
  store = { path = "../../store" }
  # Only parsing and the pure-Rust regex engine. Syntaxes and the theme come from two-face's
  # embedded sets, so hub never calls the plist and YAML loaders `default-fancy` adds, and those
  # loaders pull in crates with security advisories.
  syntect = { version = "5", default-features = false, features = [
    "parsing",
    "regex-fancy",
  ] }
  tokio = { version = "1", features = ["full"] }
  two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
  ] }
  workflows = { path = "../../workflows" }

[dev-dependencies]
  insta = "1"
  proptest = "1"
  rstest = "0.25"

[lints]
  workspace = true
