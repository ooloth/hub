[package]
  edition = "2021"
  name = "hub-tui"
  version = "0.1.0"

[[bin]]
  name = "hub-tui"
  path = "src/main.rs"

[features]
  private = ["workflows/private"]

[dependencies]
  anyhow = "1"
  chrono = "0.4"
  clients = { path = "../../clients" }
  config = { path = "../../config" }
  crossterm = { version = "0.28", features = ["event-stream"] }
  domain = { path = "../../domain" }
  futures = "0.3"
  open = "5"
  ratatui = "0.30"
  rusqlite = { version = "0.31", features = ["bundled"] }
  serde_json = "1"
  store = { path = "../../store" }
  tokio = { version = "1", features = ["full"] }
  tui-markdown = { version = "0.3", default-features = false }
  workflows = { path = "../../workflows" }

[dev-dependencies]
  insta = "1"
  rstest = "0.23"
