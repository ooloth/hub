# Code inside `#[test]` functions and `#[cfg(test)]` modules may unwrap, expect, index and panic: a
# panic is how a test reports failure, and test code never reaches a binary. A helper in an
# integration test under `tests/` is outside both, so it returns a `Result` for its tests to
# unwrap. Every other lint applies to test code as it does to library code.
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true

# Branching on an Option or Result is a `match`, which names both cases in order. These combinators
# hide the two branches in closures with the default first, and no clippy lint asks for `match`.
disallowed-methods = [
  { path = "core::option::Option::map_or", reason = "write a match: it names both cases in order" },
  { path = "core::option::Option::map_or_else", reason = "write a match: it names both cases in order" },
  { path = "core::result::Result::map_or", reason = "write a match: it names both cases in order" },
  { path = "core::result::Result::map_or_else", reason = "write a match: it names both cases in order" },
]
