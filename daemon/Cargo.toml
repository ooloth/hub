[package]
  edition = "2021"
  name = "hub-daemon"
  version = "0.1.0"

[[bin]]
  name = "hub-daemon"
  path = "src/main.rs"

[features]
  private = ["workflows/private"]

[dependencies]
  anyhow = "1"
  clap = { version = "4", features = ["derive"] }
  config = { path = "../config" }
  rusqlite = { version = "0.31", features = ["bundled"] }
  serde_json = "1"
  store = { path = "../store" }
  tokio = { version = "1", features = ["full"] }
  workflows = { path = "../workflows" }

[dev-dependencies]
  chrono = "0.4"
  domain = { path = "../domain" }
  rstest = "0.25"

[lints]
  workspace = true
