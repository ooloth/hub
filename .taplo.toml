#:schema taplo://taplo.toml

[formatting]
  # https://taplo.tamasfe.dev/configuration/formatter-options.html
  allowed_blank_lines = 1
  indent_entries = true
  indent_string = "  "
  indent_tables = true
  reorder_arrays = true
  reorder_keys = true

[[rule]]
  include = ["hub.toml", "hub.toml.example"]

  [rule.schema]
    path = "config/schemas/hub.toml.schema.json"
