name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # hub runs on macOS and is also developed in Linux sandboxes, so every push to main and every
    # pull request is checked on both (decision 031). Neither run cancels the other, so each
    # platform's result is reported.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Each action is pinned to a full commit SHA, so a moved tag cannot change the action code CI
      # runs. Dependabot proposes new pins (.github/dependabot.yml). The `stable` toolchain and the
      # tools `cargo install` fetches below still follow their latest releases.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # This action picks the toolchain from its ref, so a pinned SHA passes `toolchain` instead.
      # Its README requires the SHA to be from master's history; this one is master and the v1 tag.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: install tools
        run: cargo install cargo-audit cargo-deny cargo-nextest taplo-cli --locked

      # rustfmt resolves mod declarations even behind #[cfg(feature = "private")],
      # so it fails if the private symlinks (from hub-private) aren't present.
      # Empty stubs satisfy the resolver; the feature gate keeps them out of compilation.
      # Device-specific investigation modules need none: see investigations/mod.rs.
      - name: create private module stubs
        run: |
          mkdir -p clients/src/private workflows/src/private ui/tui/src/private
          printf '\n' > clients/src/private/mod.rs
          printf '\n' > workflows/src/private/mod.rs
          printf '\n' > ui/tui/src/private/mod.rs

      - name: fmt
        run: cargo fmt --check

      # Dependabot edits the Cargo.toml files without running prek's hooks, so CI checks their
      # formatting and schema the way prek.toml does.
      - name: taplo fmt
        run: taplo fmt --check

      - name: taplo check
        run: taplo check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo nextest run

      - name: audit
        run: cargo audit

      - name: deny
        run: cargo deny check bans advisories sources
