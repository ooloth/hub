# Keeps the Cargo dependencies and the SHA-pinned actions in .github/workflows current.
#
# Version updates arrive at most monthly, and only for releases at least 7 days old, so a
# compromised release has time to be found and pulled. Minor and patch updates are grouped into
# one PR per ecosystem. Majors open as their own PRs, so one breaking upgrade cannot block the
# rest, and the PR limit leaves room for them beside the group. For a 0.x crate Dependabot counts
# a minor bump (0.28 to 0.29) as a major, as Cargo does. The TUI crates that must move together are
# the exception, in a group of their own. Security updates ignore the version-update groups and
# would open one PR per package, so they get their own group of minor and patch updates, and a
# security major opens on its own.
#
# rust-toolchain.toml sets `channel = "stable"` rather than a version, so it has nothing for
# Dependabot to bump and has no entry here.
# The tools ci.yml installs with taiki-e/install-action are pinned by version in its `tool` input,
# which Dependabot does not read, so those versions are bumped by hand.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # ansi-to-tui depends on a ratatui version, and ratatui on a crossterm version, that
      # ui/tui/Cargo.toml must match. deny.toml rejects duplicate versions, so one moving alone
      # fails CI. They arrive as one PR, majors included. Dependabot gives a dependency to the
      # first group that matches, so this group comes before the catch-all.
      # Security updates move only the vulnerable crate, so a fix that needs a newer crossterm
      # than ratatui allows arrives alone and fails deny. cargo audit fails CI meanwhile, and the
      # fix is the ratatui upgrade this group proposes.
      tui:
        applies-to: version-updates
        patterns: [ansi-to-tui, crossterm, ratatui]
      cargo:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
