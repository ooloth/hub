[package]
  edition = "2021"
  name = "scripts"
  version = "0.1.0"

[[bin]]
  name = "scripts"
  path = "src/main.rs"

[dependencies]
  anyhow = "1"
  clap = { version = "4", features = ["derive"] }
  serde = { version = "1", features = ["derive"] }
  serde_json = "1"
  shlex = "1"

[dev-dependencies]
  rstest = "0.25"
  tempfile = "3"

[lints]
  workspace = true
