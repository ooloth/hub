[package]
  edition = "2021"
  name = "scripts"
  version = "0.1.0"

[[bin]]
  name = "scripts"
  path = "src/main.rs"

[dependencies]
  anyhow = "1"
  clap = { version = "4", features = ["derive"] }
  domain = { path = "../domain" }
  plist = "1.10.1"
  serde = { version = "1", features = ["derive"] }
  serde_json = "1"

[dev-dependencies]
  insta = "1"
  proptest = "1"
  rstest = "0.25"
  tempfile = "3"
  toml = "0.8"

[lints]
  workspace = true
