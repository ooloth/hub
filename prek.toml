# See: https://prek.j178.dev/configuration/
# Run `prek install` once after cloning to wire up the git hook.
# Run `just check` to autofix whatever prek flags.

[[repos]]
  hooks = [
    { id = "check-case-conflict" },
    { id = "check-json" },
    { id = "check-merge-conflict" },
    { id = "detect-private-key" },
    { id = "end-of-file-fixer", exclude = "\\.(rs|toml)$" },
    { id = "trailing-whitespace", exclude = "\\.(rs|toml)$" },
  ]
  repo = "builtin"

[[repos]]
  hooks = [
    { id = "audit", name = "cargo audit", entry = "cargo audit", language = "system", pass_filenames = false, stages = [
      "pre-push",
    ] },
    { id = "check-banned-terms", name = "check banned terms", entry = "scripts/check-banned-terms.sh", language = "system", pass_filenames = false },
    { id = "clippy", name = "cargo clippy", entry = "just lint", language = "system", pass_filenames = false },
    { id = "deny", name = "cargo deny", entry = "cargo deny check bans advisories sources", language = "system", pass_filenames = false, stages = [
      "pre-push",
    ] },
    { id = "fmt", name = "cargo fmt", entry = "cargo fmt --check", language = "system", pass_filenames = false },
    { id = "taplo", name = "taplo fmt", entry = "taplo fmt --check", language = "system", pass_filenames = false },
    { id = "taplo-check", name = "taplo check", entry = "taplo check", language = "system", pass_filenames = false },
    { id = "test", name = "cargo test", entry = "just test", language = "system", pass_filenames = false, stages = [
      "pre-push",
    ] },
  ]
  repo = "local"
