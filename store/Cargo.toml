[package]
  edition = "2021"
  name = "store"
  version = "0.1.0"

[dependencies]
  anyhow = "1"
  chrono = { version = "0.4", features = ["serde"] }
  dirs = "5"
  domain = { path = "../domain" }
  rusqlite = { version = "0.31", features = ["bundled"] }
  serde_json = "1"

[dev-dependencies]
  rstest = "0.25"
  tempfile = "3"

[lints]
  workspace = true
